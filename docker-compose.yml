version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    platform: linux/amd64
    container_name: vegetable-bot
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    platform: linux/amd64
    container_name: vegetable-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - app-network
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  ollama-data:
